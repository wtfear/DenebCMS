<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDeneb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="denebCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#6B11FF" />
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38EF7D" />
      <stop offset="100%" stop-color="#11998E" />
    </linearGradient>
    <filter id="summerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgDeneb)" />

  <!-- Cygnus Constellation lines -->
  <g opacity="0.18" stroke="#00F2FE" stroke-width="1.5">
    <circle cx="250" cy="200" r="4" fill="#38EF7D" />
    <circle cx="420" cy="280" r="5" fill="#00F2FE" />
    <circle cx="600" cy="220" r="6" fill="#FFFFFF" />
    <circle cx="780" cy="280" r="5" fill="#00F2FE" />
    <circle cx="950" cy="200" r="4" fill="#38EF7D" />
    <line x1="250" y1="200" x2="420" y2="280" />
    <line x1="420" y1="280" x2="600" y2="220" />
    <line x1="600" y1="220" x2="780" y2="280" />
    <line x1="780" y1="280" x2="950" y2="200" />
  </g>

  <!-- Big Hero Star Aura -->
  <g transform="translate(600, 210)">
    <circle cx="0" cy="0" r="100" fill="url(#denebCoreGrad)" opacity="0.35" filter="url(#summerGlow)" />
    <!-- 8-Point Geometric Ray -->
    <polygon points="0,-100 24,-28 100,-20 32,24 68,92 0,38 -68,92 -32,24 -100,-20 -24,-28" fill="url(#denebCoreGrad)" />
    <!-- Inner Cross -->
    <polygon points="0,-70 14,-20 70,0 14,20 0,70 -14,20 -70,0 -14,-20" fill="url(#mintGrad)" opacity="0.95" />
    <!-- Core -->
    <circle cx="0" cy="0" r="20" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="10" fill="#00F2FE" />
  </g>

  <!-- Typography -->
  <text x="600" y="380" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="3" fill="#FFFFFF">
    DENEB<tspan fill="#00F2FE">CMS</tspan>
  </text>
  
  <text x="600" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#38EF7D">
    ENTERPRISE HEADLESS CMS &amp; NEXT.JS APP ENGINE
  </text>

  <text x="600" y="470" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" letter-spacing="2" fill="#94A3B8">
    Embedded in Next.js • Code-First TypeScript Schemas • Live Preview • GraphQL &amp; REST
  </text>

  <!-- Feature Pills -->
  <g transform="translate(600, 535)">
    <g transform="translate(-330, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">100% MIT Licensed</text>
    </g>
    <g transform="translate(-110, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1E293B" stroke="#00F2FE" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#00F2FE">Next.js 15 Native</text>
    </g>
    <g transform="translate(110, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1E293B" stroke="#38EF7D" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#38EF7D">Drizzle / PostgreSQL</text>
    </g>
    <g transform="translate(330, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Turnkey Docker</text>
    </g>
  </g>
</svg>
